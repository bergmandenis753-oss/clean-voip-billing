name: Unpack clean template

on:
  workflow_dispatch:
  push:
    paths:
      - clean-voip-billing-template.tar.gz.b64.part-*
      - .github/workflows/unpack-template.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack clean template
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(clean-voip-billing-template.tar.gz.b64.part-*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Archive parts are absent, nothing to unpack."
            exit 0
          fi
          if [ ${#parts[@]} -ne 5 ]; then
            echo "Expected 5 archive parts, found ${#parts[@]}. Waiting for all parts."
            exit 0
          fi
          : > /tmp/clean-template.b64
          for part in "${parts[@]}"; do
            case "$part" in
              *part-05) head -c 3116 "$part" >> /tmp/clean-template.b64 ;;
              *) head -c 35000 "$part" >> /tmp/clean-template.b64 ;;
            esac
          done
          mkdir -p /tmp/clean-template
          base64 -d /tmp/clean-template.b64 | tar -xzf - -C /tmp/clean-template
          rsync -a --delete --exclude '.git' /tmp/clean-template/clean-voip-billing/ ./
          rm -f clean-voip-billing-template.tar.gz.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unpack clean VoIP billing template"
          git push
