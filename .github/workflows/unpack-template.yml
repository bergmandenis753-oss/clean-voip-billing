name: Unpack clean template

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/unpack-template.yml
      - clean-voip-billing-template.tar.gz.b64.part-*

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and unpack clean template
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://tmpfiles.org/wmw5CeZza5tt/clean-voip-billing-template.tar.gz"
          expected_sha="3ca6c66762055333ccfc8113ca3fd238caed0c5e265000878cd1dc36b38d0e07"
          download_url="$(curl -fsSL "$page_url" | grep -oE 'https://tmpfiles\.org/dl/[^"]+' | head -n 1)"
          if [ -z "$download_url" ]; then
            echo "Could not find tmpfiles download URL."
            exit 1
          fi
          curl -fsSL "$download_url" -o /tmp/clean-template.tar.gz
          echo "$expected_sha  /tmp/clean-template.tar.gz" | sha256sum -c -
          mkdir -p /tmp/clean-template
          tar -xzf /tmp/clean-template.tar.gz -C /tmp/clean-template
          rsync -a --delete --exclude '.git' /tmp/clean-template/clean-voip-billing/ ./
          rm -f clean-voip-billing-template.tar.gz.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unpack clean VoIP billing template"
          git push
